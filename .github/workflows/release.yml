name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release
        shell: pwsh

      - name: Run tests
        run: cargo test --release
        shell: pwsh

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Trusted Signing client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trustedsigning | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client" -OutFile trustedsigning\client.nupkg
          Expand-Archive -Path trustedsigning\client.nupkg -DestinationPath trustedsigning\extracted -Force

      - name: Write signing metadata
        shell: pwsh
        run: |
          @'
          {
            "Endpoint": "https://weu.codesigning.azure.net/",
            "CodeSigningAccountName": "leatham-signing-account",
            "CertificateProfileName": "cert-profile"
          }
          '@ | Set-Content -Path trustedsigning\metadata.json -Encoding utf8

      - name: Locate signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Recurse -Filter "signtool.exe" "C:\Program Files (x86)\Windows Kits\10\bin" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign browser_picker.exe
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /v /debug /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib "trustedsigning\extracted\bin\x64\Azure.CodeSigning.Dlib.dll" `
            /dmdf "trustedsigning\metadata.json" `
            "target\release\browser_picker.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

          & $env:SIGNTOOL verify /pa /v "target\release\browser_picker.exe"
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }

      - name: Build installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''

          $iscc = Get-ChildItem -Recurse -Filter "ISCC.exe" "C:\Program Files (x86)\Inno Setup 6" -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements
            $iscc = Get-ChildItem -Recurse -Filter "ISCC.exe" "$env:LOCALAPPDATA\Programs\Inno Setup 6" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }

          & $iscc "installer\setup.iss" "/DMyAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Sign installer
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /v /debug /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
            /dlib "trustedsigning\extracted\bin\x64\Azure.CodeSigning.Dlib.dll" `
            /dmdf "trustedsigning\metadata.json" `
            "target\installer\BrowserPickerSetup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

          & $env:SIGNTOOL verify /pa /v "target\installer\BrowserPickerSetup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signature verification failed" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/browser_picker.exe
            target/installer/BrowserPickerSetup.exe
          generate_release_notes: true
