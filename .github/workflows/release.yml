name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build-sign-release:
    runs-on: windows-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release
        shell: pwsh

      - name: Run tests
        run: cargo test --release
        shell: pwsh

      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Trusted Signing client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path trustedsigning | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client" -OutFile trustedsigning\client.nupkg
          Expand-Archive -Path trustedsigning\client.nupkg -DestinationPath trustedsigning\extracted -Force

      - name: Write signing metadata
        shell: pwsh
        run: |
          @'
          {
            "Endpoint": "https://weu.codesigning.azure.net/",
            "CodeSigningAccountName": "leatham-signing-account",
            "CertificateProfileName": "cert-profile"
          }
          '@ | Set-Content -Path trustedsigning\metadata.json -Encoding utf8

      - name: Locate signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Recurse -Filter "signtool.exe" "C:\Program Files (x86)\Windows Kits\10\bin" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Pack and sign with Velopack
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $repoAbs = (Resolve-Path ".").Path
          $signTemplate = "`"$env:SIGNTOOL`" sign /v /debug /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 " +
            "/dlib `"$repoAbs\trustedsigning\extracted\bin\x64\Azure.CodeSigning.Dlib.dll`" " +
            "/dmdf `"$repoAbs\trustedsigning\metadata.json`" `"{{file}}`""

          # Pulls the previous release's packages (if any) so this pack can
          # produce a delta update alongside the full one; the very first
          # Velopack release simply finds nothing to diff against.
          vpk download github --repoUrl "https://github.com/${{ github.repository }}"

          vpk pack `
            -u BrowserPicker `
            -v $version `
            -p target\release `
            -e browser_picker.exe `
            -i assets\browser_picker.ico `
            --signTemplate $signTemplate
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed with exit code $LASTEXITCODE" }

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          # Without --tag, vpk derives its own tag from --packVersion (e.g.
          # "0.1.6", no "v") instead of using the tag that triggered this
          # workflow - not what we want given every other tag here is "v*".
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --tag "$env:GITHUB_REF_NAME" --publish --token "${{ secrets.GITHUB_TOKEN }}"
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed with exit code $LASTEXITCODE" }

          # Best-effort, mirroring what the old softprops/action-gh-release
          # step used to do. `gh release edit` has no --generate-notes of its
          # own (that's a `create`-only flag) - fetch notes via the API and
          # set them explicitly. Not fatal: the release itself is already
          # published above, so a hiccup here shouldn't fail the whole job.
          $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$env:GITHUB_REF_NAME" --jq .body
          if ($LASTEXITCODE -eq 0 -and $notes) {
            Set-Content -Path notes.md -Value $notes -Encoding utf8
            gh release edit "$env:GITHUB_REF_NAME" --notes-file notes.md
          }
          $global:LASTEXITCODE = 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to blob storage
        shell: pwsh
        run: |
          # The Microsoft Store's Package URL validation rejects GitHub Release
          # asset URLs because they 302-redirect to a signed CDN URL. Blob
          # storage serves the file directly with no redirect, so the signed
          # installer is mirrored here purely to satisfy that requirement.
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          $setup = Get-ChildItem "Releases" -Filter "*Setup.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $setup) { throw "no *Setup.exe found under Releases\" }
          az storage blob upload `
            --account-name leathamdl `
            --container-name browser-picker `
            --name "$version/BrowserPickerSetup.exe" `
            --file "$setup" `
            --auth-mode login `
            --overwrite true
          if ($LASTEXITCODE -ne 0) { throw "blob upload failed with exit code $LASTEXITCODE" }
          "Package URL: https://leathamdl.blob.core.windows.net/browser-picker/$version/BrowserPickerSetup.exe" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
