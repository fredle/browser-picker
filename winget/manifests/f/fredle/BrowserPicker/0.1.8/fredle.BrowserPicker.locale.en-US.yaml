PackageUrl: https://github.com/fredle/browser-picker
License: Freeware
ShortDescription: Choose which Chrome or Edge profile opens each link you click, or save a rule so a site always opens in the same profile.
Description: |-
  Set Browser Picker as your default browser and every link you click in Outlook, Teams, Slack or any other app shows a small picker with your Chrome and Edge profiles, each with its real name and photo. Click one, or press its number, and the link opens there.

  Right-click a profile to make it the default for that site; from then on links to that site open straight in the right profile with no window at all. Rules support wildcards, and holding Shift while clicking a link bypasses them.

  Optionally resolves links rewritten by Mimecast, Microsoft Defender SafeLinks, Proofpoint, Barracuda and Symantec to their real destination before matching rules.

  A single small program with no background process. Installs per user without administrator rights and updates itself.
